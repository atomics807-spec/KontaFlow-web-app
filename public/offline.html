<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KontaFlow · Offline</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f8f5ee; color: #08140f;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; }
    .card { max-width: 420px; text-align: center; background: #fff; border: 1px solid #e5dfd1; border-radius: 24px; padding: 32px; }
    .mark { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 20px; display: grid; place-items: center;
      background: linear-gradient(135deg,#16a97e,#0b7a5a); color: #fff; font-weight: 800; font-size: 22px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #55675f; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
    a { display: inline-block; background: #0b7a5a; color: #fff; text-decoration: none; font-weight: 600;
      padding: 12px 20px; border-radius: 999px; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">K</div>
    <h1>You are offline</h1>
    <p>KontaFlow is waiting for a connection. Transactions you record now are saved on this device and sync automatically when you are back online.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
